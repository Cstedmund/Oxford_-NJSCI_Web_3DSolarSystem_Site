name: Build WebGL from private source and Deploy to Pages

# ⚠️ 這個檔案要放到「公開 repo」：Oxford_-NJSCI_Web_3DSolarSystem_Site
#    路徑：.github/workflows/build-and-deploy.yml
#
# 觸發時機：
#   1. 由私人 repo 發送的 repository_dispatch (event-type: build-webgl)
#   2. 手動在 Actions 頁面點 "Run workflow"
#
# 這個 repo 是公開的，Actions 分鐘免費無限。
# 它會用唯讀 PAT 簽出私人源碼來建置，再把成品部署到自己的 GitHub Pages。
on:
  repository_dispatch:
    types: [build-webgl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 0. 守門員：Secrets 未設定時立即失敗，避免白跑 30 分鐘
      - name: Check required secrets
        if: env.SOURCE_REPO_TOKEN == '' || env.UNITY_LICENSE == '' || env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == ''
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          echo "::error::Missing secrets. 請在「本公開 repo」設定：Settings -> Secrets and variables -> Actions"
          echo "::error::  SOURCE_REPO_TOKEN (Fine-grained PAT，對私人源碼 repo 只有 Contents: Read)"
          echo "::error::  UNITY_LICENSE    (Unity_lic.ulf 的原始文字內容)"
          echo "::error::  UNITY_EMAIL      (Unity Hub 帳號 Email)"
          echo "::error::  UNITY_PASSWORD   (Unity Hub 帳號密碼)"
          exit 1

      # 1. 用唯讀 PAT 簽出「私人源碼 repo」
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Cstedmund/Oxford_-NJSCI_Web_3DSolarSystem
          ref: ReleaseBuild_2026
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0
          lfs: true

      # 2. 快取 Unity Library 加速建置
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 3. 用 game-ci 建置 WebGL
      - name: Unity Build (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: Web_Solar
          buildsPath: build

      # 4. 檢查輸出
      - name: Verify build output
        run: |
          ls -la build/WebGL/Web_Solar
          test -f build/WebGL/Web_Solar/index.html && echo "index.html OK" || { echo "index.html MISSING"; exit 1; }

      # 5. 交給 Pages 佈署
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/Web_Solar

      # 6. 正式部署（Pages Source 需設為 "GitHub Actions"）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
